# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - clinic-api-123

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build with dotnet (Zero-Warning Gate)
        run: dotnet build src/Clinic.API/Clinic.API.csproj --configuration Release /warnaserror

      - name: Run Automated Test Gate (Full Suite)
        run: dotnet test --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: dotnet publish
        run: dotnet publish src/Clinic.API/Clinic.API.csproj -c Release -r win-x86 --self-contained true -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CF0F561A09484FD4AF9D744F0C68C39E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2B14C4AB90E442328AF17370A07F19CA }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D631845D05A74A55A5253F933AAF52EA }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'clinic-api-123'
          slot-name: 'Production'
          package: .

      - name: Verify Live Production Health (Synthetic Post-Deploy Smoke Gate)
        shell: pwsh
        run: |
          Write-Host "Waiting 25 seconds for Azure App Service warmup and auto-migrations..."
          Start-Sleep -Seconds 25

          $baseUrl = "https://clinic-api-123-a0ghf9aeb5ccawha.swedencentral-01.azurewebsites.net"

          # 1. Health Probe
          Write-Host "Probing $baseUrl/api/health..."
          $health = Invoke-RestMethod -Uri "$baseUrl/api/health" -Method Get -TimeoutSec 30
          Write-Host "Health Probe Output: $($health | ConvertTo-Json -Compress)"
          if ($health.status -ne "awake" -and $health.database -ne "connected") {
            throw "Health probe failed! Database connection is unhealthy."
          }

          # 2. Login & Token Validation
          Write-Host "Verifying Authentication & Token Issuance..."
          $loginBody = @{
            email = "msami11095@gmail.com"
            password = "Sami@11095"
          } | ConvertTo-Json
          $authRes = Invoke-RestMethod -Uri "$baseUrl/api/auth/login" -Method Post -Body $loginBody -ContentType "application/json" -TimeoutSec 30
          $token = $authRes.token
          if ([string]::IsNullOrEmpty($token)) {
            throw "Authentication failed! No JWT token returned."
          }
          Write-Host "Authentication succeeded. User: $($authRes.user.name)"

          $headers = @{
            Authorization = "Bearer $token"
          }

          # 3. Critical Business Endpoints Verification
          $endpoints = @(
            "/api/clinics",
            "/api/patients",
            "/api/appointments",
            "/api/doctors",
            "/api/billing",
            "/api/executive/analytics/summary",
            "/api/executive/analytics/branches",
            "/api/mobile/devices/my-devices"
          )

          foreach ($ep in $endpoints) {
            Write-Host "Probing $baseUrl$ep..."
            $res = Invoke-RestMethod -Uri "$baseUrl$ep" -Method Get -Headers $headers -TimeoutSec 30
            Write-Host "SUCCESS: $ep responded 200 OK"
          }

          Write-Host "All post-deployment production smoke tests passed with 100% success!"
